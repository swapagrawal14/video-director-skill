<!doctype html><html><head><meta charset="utf-8"><title>चाय में नमक</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head><body>
<!-- Painted pose-pack duet. Deterministic: window.renderAt(t) is a pure function of t. Raster art only, no SVG. -->
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { loadRig, makeRigActor, drawRigActor, speechTrack } from './headrig3d.js';
import { paintedSet } from './posepack3d.js';
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.outputColorSpace = THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const cam = new THREE.PerspectiveCamera(30, W / H, .1, 50); cam.position.set(0, .95, 5);
const TL = await (await fetch('timeline.json')).json();
const setTex = await new THREE.TextureLoader().loadAsync('set-aangan.png');
const set = paintedSet(setTex, cam, -3.2, 1.25, 1.2); scene.add(set);
const DJ = makeRigActor(await loadRig('cast2/dadaji'), { height: 1.62, tint: '#fff4e6' });
const DD = makeRigActor(await loadRig('cast2/dadi'), { height: 1.5, tint: '#fff4e6' });
scene.add(DJ.group, DD.group);
const L = TL.lines;
// One shared head each: every expression change below is a directed key, nothing changes by itself.
const dirDJ = { x: -.40, z: 0, seed: 3, speech: speechTrack(TL.mouth.sharmaji, TL.fps),
  body:  [{ t: 0, v: 'idle' }, { t: L[0].t0 - .1, v: 'outraged' }, { t: L[0].t0 + 2.3, v: 'point' }, { t: L[1].t0 + .4, v: 'idle' }, { t: L[2].t0 - .1, v: 'talk' }, { t: L[2].t1 + .2, v: 'think' }, { t: L[3].t1 + .5, v: 'laugh' }],
  brows: [{ t: 0, v: null }, { t: L[0].t0 - .1, v: 'angry' }, { t: L[1].t0 + 1.2, v: null }, { t: L[2].t0 - .1, v: 'angry' }, { t: L[3].t0 + 2.0, v: null }],
  mouth: [{ t: 0, v: null }, { t: L[3].t1 + .5, v: 'laugh' }],
  eyes:  [{ t: 0, v: null }, { t: L[3].t1 + .7, v: 'closed' }],
  tilt:  [{ t: 0, v: 0 }, { t: L[0].t0 + .2, v: .04 }, { t: L[1].t0 + .2, v: -.03 }, { t: L[2].t0, v: .05 }, { t: L[2].t1 + .2, v: -.02 }, { t: L[3].t1 + .5, v: -.06 }] };
const dirDD = { x: .43, z: .12, seed: 7, speech: speechTrack(TL.mouth.kaushalya, TL.fps),
  body:  [{ t: 0, v: 'idle' }, { t: L[0].t0 + 1.2, v: 'sheepish' }, { t: L[1].t0 - .1, v: 'talk' }, { t: L[1].t1 + .2, v: 'arms_crossed' }, { t: L[3].t0 - .1, v: 'point' }, { t: L[3].t0 + 1.9, v: 'talk' }, { t: L[3].t1 + .2, v: 'laugh' }],
  brows: [{ t: 0, v: null }, { t: L[0].t0 + .5, v: 'up' }, { t: L[1].t1 + .2, v: null }],
  mouth: [{ t: 0, v: null }, { t: L[3].t1 + .2, v: 'laugh' }],
  eyes:  [{ t: 0, v: null }, { t: L[3].t1 + .35, v: 'closed' }],
  tilt:  [{ t: 0, v: 0 }, { t: L[0].t0 + .5, v: .04 }, { t: L[1].t0, v: -.03 }, { t: L[1].t1 + .2, v: .05 }, { t: L[3].t0, v: -.04 }, { t: L[3].t1 + .2, v: .07 }] };
// camera: wide two-shot pushing in, hard cut to a medium on her punchline, cut back wide for the laugh
function camAt(t) {
  if (t >= L[3].t0 - .1 && t < L[3].t1 + .1) { const k = (t - L[3].t0) / 3.5; return [.34 + k * .03, 1.12, 3.7 - k * .25, .34, 1.02]; }
  const k = Math.min(1, t / TL.duration); return [Math.sin(t * .2) * .05, .95, 5 - k * .6, 0, .88];
}
window.DURATION = TL.duration;
window.renderAt = (t) => {
  drawRigActor(DJ, t, dirDJ); drawRigActor(DD, t, dirDD);
  const [x, y, z, lx, ly] = camAt(t); cam.position.set(x, y, z); cam.lookAt(lx, ly, 0);
  set.position.x = x * .35;                                             // parallax: backdrop drifts less than the stage
  renderer.render(scene, cam);
};
window.grab = (t, q = .93) => { window.renderAt(t); return renderer.domElement.toDataURL('image/jpeg', q); };
window.renderAt(0); window.READY = true;
</script></body></html>
