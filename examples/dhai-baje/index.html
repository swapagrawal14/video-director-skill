<!doctype html>
<html><head><meta charset="utf-8">
<!-- "ढाई बजे" — vertical horror short. Custom scene for the Video Director skill.
     Deterministic: window.renderAt(t) is a pure function of t. -->
<style>
@font-face{font-family:Baloo;src:url(fonts/baloo2.ttf);font-weight:400 800}
html,body{margin:0;background:#000;overflow:hidden}
canvas{display:block}
</style></head>
<body>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
await Promise.all(['400','600','800'].map(w => document.fonts.load(w + ' 40px Baloo')));
const P = await (await fetch('project.json')).json();
const TM = await (await fetch('timing.json')).json();
const W = P.width || 720, H = Math.round(W * 16 / 9), K = W / 720;
const SC = TM.scenes;
window.DURATION = TM.duration;

/* ---------- utils (all deterministic) ---------- */
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ease = x => { x = clamp(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; };
const easeOut = x => 1 - Math.pow(1 - clamp(x), 3);
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
const win = (t, a, b) => t >= a && t < b;
const stut = (t, salt = 0) => hash(Math.floor(t * 24) + salt * 977) > 0.45 ? 1 : 0.05;   // frame-level sputter

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1); renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.85;
renderer.outputColorSpace = THREE.SRGBColorSpace;
const out = document.createElement('canvas'); out.width = W; out.height = H; document.body.appendChild(out);
const ctx = out.getContext('2d');
const scene = new THREE.Scene(); scene.background = new THREE.Color('#010203');
scene.fog = new THREE.FogExp2('#020304', 0.036);
const cam = new THREE.PerspectiveCamera(62, W / H, 0.05, 80);

/* ---------- procedural textures ---------- */
function canvasTex(w, h, draw, rep = [1, 1]) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...rep); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const wallTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#7b7a68'; g.fillRect(0, 0, w, h);
  g.fillStyle = '#3d4a3c'; g.fillRect(0, h * .58, w, h * .42);               // old green dado
  g.fillStyle = '#2c342b'; g.fillRect(0, h * .57, w, 6);
  for (let i = 0; i < 2600; i++) { g.fillStyle = `rgba(${rnd() < .5 ? '20,18,10' : '160,150,120'},${rnd() * .08})`; g.fillRect(rnd() * w, rnd() * h, 2 + rnd() * 9, 2 + rnd() * 9); }
  for (let i = 0; i < 14; i++) {                                              // water stains dripping down
    const x = rnd() * w, len = 60 + rnd() * 260; const gr = g.createLinearGradient(0, 0, 0, len);
    gr.addColorStop(0, 'rgba(60,45,20,.35)'); gr.addColorStop(1, 'rgba(60,45,20,0)'); g.fillStyle = gr; g.fillRect(x, 0, 4 + rnd() * 18, len);
  }
  g.strokeStyle = 'rgba(20,18,12,.5)'; g.lineWidth = 1.5;                       // cracks
  for (let i = 0; i < 6; i++) { let x = rnd() * w, y = rnd() * h * .5; g.beginPath(); g.moveTo(x, y); for (let k = 0; k < 9; k++) { x += (rnd() - .5) * 30; y += rnd() * 22; g.lineTo(x, y); } g.stroke(); }
}, [5, 1]);
const floorTex = canvasTex(512, 512, (g, w, h) => {
  const n = 8, s = w / n;
  for (let i = 0; i < n; i++) for (let j = 0; j < n; j++) { const v = (i + j) % 2 ? 58 : 118; const d = rnd() * 22; g.fillStyle = `rgb(${v - d},${v - d - 4},${v - d - 10})`; g.fillRect(i * s, j * s, s, s); }
  for (let i = 0; i < 3000; i++) { g.fillStyle = `rgba(10,8,4,${rnd() * .12})`; g.fillRect(rnd() * w, rnd() * h, 3 + rnd() * 12, 3 + rnd() * 12); }
  g.strokeStyle = 'rgba(0,0,0,.35)'; g.lineWidth = 3; for (let i = 0; i <= n; i++) { g.beginPath(); g.moveTo(i * s, 0); g.lineTo(i * s, h); g.stroke(); g.beginPath(); g.moveTo(0, i * s); g.lineTo(w, i * s); g.stroke(); }
}, [1.2, 17]);

/* ---------- corridor ---------- */
const CW = 2.4, CH = 3.0, Z0 = 3, Z1 = -31, LEN = Z0 - Z1;
const wallMat = new THREE.MeshStandardMaterial({ map: wallTex, roughness: .95 });
const floor = new THREE.Mesh(new THREE.PlaneGeometry(CW, LEN), new THREE.MeshStandardMaterial({ map: floorTex, roughness: .55, metalness: .05 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, (Z0 + Z1) / 2); scene.add(floor);
const ceil = new THREE.Mesh(new THREE.PlaneGeometry(CW, LEN), new THREE.MeshStandardMaterial({ color: '#4a4740', roughness: 1 }));
ceil.rotation.x = Math.PI / 2; ceil.position.set(0, CH, (Z0 + Z1) / 2); scene.add(ceil);
for (const sx of [-1, 1]) {
  const wall = new THREE.Mesh(new THREE.PlaneGeometry(LEN, CH), wallMat);
  wall.rotation.y = -sx * Math.PI / 2; wall.position.set(sx * CW / 2, CH / 2, (Z0 + Z1) / 2); scene.add(wall);
}
const endWall = new THREE.Mesh(new THREE.PlaneGeometry(CW, CH), wallMat); endWall.position.set(0, CH / 2, Z1); scene.add(endWall);
// EXIT sign at the far end: backlights the figure as a silhouette
const exitC = canvasTex(256, 96, (g, w, h) => { g.fillStyle = '#0b3d1a'; g.fillRect(0, 0, w, h); g.fillStyle = '#7dff9e'; g.font = '700 64px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillText('EXIT', w / 2, h / 2 + 4); });
const exitM = new THREE.MeshBasicMaterial({ map: exitC }); const exitS = new THREE.Mesh(new THREE.PlaneGeometry(.5, .19), exitM); exitS.position.set(0, 2.55, Z1 + .02); scene.add(exitS);
const exitL = new THREE.PointLight('#3dff7a', 1.6, 7, 1.5); exitL.position.set(0, 2.3, Z1 + .6); scene.add(exitL);
const backWall = new THREE.Mesh(new THREE.PlaneGeometry(CW, CH), wallMat); backWall.rotation.y = Math.PI; backWall.position.set(0, CH / 2, Z0); scene.add(backWall);

// doors: dark wood, brass handle, room-number plates
const doorMat = new THREE.MeshStandardMaterial({ color: '#2a1c12', roughness: .7 });
const frameMat = new THREE.MeshStandardMaterial({ color: '#1a120c', roughness: .8 });
const brass = new THREE.MeshStandardMaterial({ color: '#8a6d3b', metalness: .8, roughness: .35 });
const doors = [];
for (let k = 0; k < 6; k++) for (const sx of [-1, 1]) {
  const z = 0.6 - k * 5.2 + (sx > 0 ? 2.4 : 0); if (z < Z1 + 1) continue;
  const g = new THREE.Group();
  const fr = new THREE.Mesh(new THREE.BoxGeometry(.06, 2.2, 1.05), frameMat); fr.position.set(0, 1.1, 0); g.add(fr);
  const dr = new THREE.Mesh(new THREE.BoxGeometry(.05, 2.05, .9), doorMat); dr.position.set(-sx * .03, 1.03, 0); g.add(dr);
  const hd = new THREE.Mesh(new THREE.SphereGeometry(.035, 16, 12), brass); hd.position.set(-sx * .07, 1.0, sx * .32); g.add(hd);
  const pl = new THREE.Mesh(new THREE.BoxGeometry(.01, .09, .16), brass); pl.position.set(-sx * .06, 1.65, 0); g.add(pl);
  g.position.set(sx * (CW / 2 - .02), 0, z); scene.add(g); doors.push({ g, dr, hd, sx, z });
}
// the near right door the narrator tries (index chosen by z closest to camera start)
const myDoor = doors.filter(d => d.sx > 0).sort((a, b) => Math.abs(a.z + 2.2) - Math.abs(b.z + 2.2))[0];

/* ---------- bulbs ---------- */
const BZ = [0.2, -6, -12, -18, -24.5];
const bulbs = BZ.map((z, i) => {
  const g = new THREE.Group();
  const cord = new THREE.Mesh(new THREE.CylinderGeometry(.006, .006, .45), new THREE.MeshBasicMaterial({ color: '#111' })); cord.position.y = -.22; g.add(cord);
  const glass = new THREE.MeshStandardMaterial({ color: '#fff4d6', emissive: '#ffcf86', emissiveIntensity: 2 });
  const b = new THREE.Mesh(new THREE.SphereGeometry(.06, 16, 12), glass); b.position.y = -.48; g.add(b);
  const L = new THREE.PointLight('#ffc983', 5, 9, 1.6); L.position.y = -.5; g.add(L);
  g.position.set(0, CH, z); scene.add(g); return { g, glass, L, z };
});
// phone torch the narrator switches on at the door (scene 4); dies with everything else
scene.add(cam);
const torch = new THREE.SpotLight('#dfe8ff', 0, 12, .42, .55, 1.4); torch.position.set(.08, -.12, 0); cam.add(torch); cam.add(torch.target); torch.target.position.set(0, -.1, -1);
const amb = new THREE.AmbientLight('#2a3550', 0.05); scene.add(amb);
const under = new THREE.PointLight('#bcd0ff', 0, 2.5, 2); scene.add(under);  // for the face

/* ---------- the figure ---------- */
const skin = new THREE.MeshStandardMaterial({ color: '#4d4a46', roughness: .85 });
const cloth = new THREE.MeshStandardMaterial({ color: '#0d0d0e', roughness: 1 });
const hairM = new THREE.MeshStandardMaterial({ color: '#030303', roughness: .55 });
const hairB = new THREE.MeshBasicMaterial({ color: '#000' });
const eyeM = new THREE.MeshBasicMaterial({ color: '#e8eef5', transparent: true, opacity: .0, fog: false });
const fig = new THREE.Group();
{
  const dressPts = [[.0,0],[.30,0],[.27,.4],[.22,.9],[.17,1.35],[.15,1.6],[.2,1.72],[.19,1.78],[.07,1.84],[0,1.85]].map(p => new THREE.Vector2(p[0], p[1]));
  const dress = new THREE.Mesh(new THREE.LatheGeometry(dressPts, 28), cloth); dress.scale.set(1, 1, .62); fig.add(dress);
  for (let i = 0; i < 7; i++) { const a = i / 7 * Math.PI * 2; const r = new THREE.Mesh(new THREE.BoxGeometry(.06, .5 + hash(i + 9) * .3, .03), cloth); r.position.set(Math.cos(a) * .27, .2, Math.sin(a) * .17); r.rotation.y = -a; fig.add(r); } // torn hem
  const neck = new THREE.Mesh(new THREE.CylinderGeometry(.035, .045, .2, 10), skin); neck.position.set(.04, 1.93, .03); neck.rotation.z = -.35; fig.add(neck);
  const head = new THREE.Mesh(new THREE.SphereGeometry(.11, 24, 18), skin); head.scale.set(.85, 1.15, .95); head.position.set(.09, 2.04, .07); fig.add(head);
  fig.userData.head = head;
  const hg = new THREE.Group(); hg.position.copy(head.position); fig.add(hg); fig.userData.hair = hg;
  const cap = new THREE.Mesh(new THREE.SphereGeometry(.118, 24, 16, 0, Math.PI * 2, 0, 1.7), hairM); cap.scale.set(.9, 1.2, 1.0); hg.add(cap);
  for (let i = 0; i < 46; i++) {                                                  // long wet hair, covering the face, down to the waist
    const a = (i / 45 - .5) * 3.7, len = .7 + hash(i) * .5;
    const h = new THREE.Mesh(new THREE.BoxGeometry(.017 + hash(i + 1) * .012, len, .008), hairM);
    h.position.set(Math.sin(a) * .1, .06 - len / 2, Math.cos(a) * .1); h.rotation.set((hash(i + 3) - .5) * .12, a, (hash(i + 7) - .5) * .1); hg.add(h);
  }
  for (const sx of [-1, 1]) {                                                     // arms far too long, wrists at the knees
    const arm = new THREE.Mesh(new THREE.CapsuleGeometry(.028, 1.1, 4, 8), skin); arm.position.set(sx * .24, 1.17, 0); arm.rotation.z = sx * .07; fig.add(arm);
    for (let f = 0; f < 4; f++) { const fi = new THREE.Mesh(new THREE.CapsuleGeometry(.009, .16, 2, 6), skin); fi.position.set(sx * (.275 + f * .004), .52, (f - 1.5) * .016); fi.rotation.z = sx * .1; fig.add(fi); }
  }
  for (const sx of [-1, 1]) { const e = new THREE.Mesh(new THREE.SphereGeometry(sx > 0 ? .0075 : .004, 8, 6), eyeM); e.position.set(.09 + sx * .035, 2.05, .17); fig.add(e); }
  scene.add(fig);
}
/* ---------- the face (jump scare) ---------- */
const face = new THREE.Group();
{
  const pale = new THREE.MeshStandardMaterial({ color: '#8d8c80', roughness: .75 });
  const blk = new THREE.MeshBasicMaterial({ color: '#000' });
  const head = new THREE.Mesh(new THREE.SphereGeometry(.2, 48, 36), pale); head.scale.set(.85, 1.2, .8);
  const pos = head.geometry.attributes.position;                                  // gaunt: sunken cheeks, sharp jaw
  for (let i = 0; i < pos.count; i++) { const x = pos.getX(i), y = pos.getY(i), z = pos.getZ(i);
    const cheek = Math.exp(-((y + .02) ** 2) / .004) * Math.exp(-((Math.abs(x) - .12) ** 2) / .003) * .035;
    pos.setXYZ(i, x * (1 - cheek * 6), y, z - (z > 0 ? cheek : 0)); }
  head.geometry.computeVertexNormals(); face.add(head);
  for (const sx of [-1, 1]) {
    const sock = new THREE.Mesh(new THREE.SphereGeometry(.026, 24, 16), new THREE.MeshStandardMaterial({ color: '#0c0b0a', roughness: 1 })); sock.scale.set(1.0, .62, .4); sock.position.set(sx * .058, .045, .152); face.add(sock);
    const pup = new THREE.Mesh(new THREE.SphereGeometry(.0055, 12, 8), new THREE.MeshBasicMaterial({ color: '#dfe6e0' })); pup.position.set(sx * .055, .043, .166); face.add(pup);
  }
  const mouth = new THREE.Mesh(new THREE.SphereGeometry(.03, 24, 16), blk); mouth.scale.set(.8, 2.2, .5); mouth.position.set(0, -.13, .14); face.add(mouth);
  face.userData.mouth = mouth;
  for (let i = 0; i < 34; i++) { const a = (i / 33 - .5) * 3.9, len = .55 + hash(i + 50) * .45;
    const h = new THREE.Mesh(new THREE.BoxGeometry(.04, len, .015), hairB); h.position.set(Math.sin(a) * .185, .26 - len / 2, Math.cos(a) * .135 - .01); h.rotation.set(-.08, a, (hash(i) - .5) * .15); face.add(h); }
  const crown = new THREE.Mesh(new THREE.SphereGeometry(.2, 24, 16, 0, Math.PI * 2, 0, 1.25), hairB); crown.scale.set(.92, 1.05, .9); crown.position.set(0, .045, -.015); face.add(crown);
  face.visible = false; scene.add(face);
}

/* ---------- timeline ---------- */
const S = k => SC[k].t, E = k => SC[k].t + SC[k].d;
const scareT = S(5) + 7.6;                       // stinger frame (mix.py places the stinger exactly here)
window.SCARE_T = scareT;
// flicker events: [start, length] in global seconds; the figure only moves while the light is off
const EV = [S(2) + 2.9, S(3) + 1.4, S(3) + 3.6, S(3) + 5.9, S(3) + 8.1, S(3) + 10.3];
const FZ = [-24.2, -24.2, -19.5, -15, -10.5, -6.8, -4.6];   // figure z after n events
const EVLEN = 0.42;
function nEvents(t) { let n = 0; for (const e of EV) if (t >= e + EVLEN * .5) n++; return n; }
function inEvent(t) { for (const e of EV) if (t >= e && t < e + EVLEN) return (t - e) / EVLEN; return -1; }

function bulbLevel(i, t) {
  if (t < S(1)) { const on = 0.25 + i * 0.45; if (t < on) return 0; if (t < on + .7) return stut(t, i) * (.4 + .6 * (t - on) / .7); return 1; }   // sputter on, near to far
  if (t >= S(5) + .25) {                                       // die one by one, far to near
    const off = S(5) + .25 + (4 - i) * .32; if (t >= off) {
      if (i === 0 && t >= scareT - .05 && t < scareT + .55) return t < scareT + .32 ? 1.5 : 1.5 * stut(t + .3, 9);   // flash on the scare
      return 0; }
    return t > off - .3 ? stut(t, i + 3) : 1;
  }
  const ev = inEvent(t); if (ev >= 0) return ev < .15 || ev > .85 ? stut(t, i + 11) * .5 : 0;  // whole corridor blinks
  if (win(t, S(1), S(2))) return i === 0 ? (hash(Math.floor(t * 6)) > .9 ? .25 : 1) : 1;      // overhead hums
  if (win(t, S(2), S(2) + 2.9) && i === 4) return hash(Math.floor(t * 12)) > .6 ? .1 : 1;    // far bulb misbehaving
  if (win(t, S(4), S(5))) return hash(Math.floor(t * 8) + i) > .93 ? .3 : 1;
  return 1;
}

/* ---------- camera paths ---------- */
function handheld(t, a = 1) { return [Math.sin(t * 1.3) * .012 * a + Math.sin(t * 3.1) * .004 * a, Math.sin(t * 1.7 + 1) * .01 * a, Math.sin(t * .9 + 2) * .008 * a]; }
function camAt(t) {
  let pos = [0, 1.62, 2.2], yaw = 0, pitch = 0, roll = 0, fov = 62, shake = 1;
  if (t < S(1)) { const u = ease(t / SC[0].d); pos[2] = lerp(2.4, 1.2, u); pitch = lerp(-.02, .02, u); }
  else if (t < S(2)) { const u = (t - S(1)) / SC[1].d; pos[2] = 1.1; pitch = .55 * Math.sin(Math.PI * ease(clamp(u * 1.15))); yaw = .08 * Math.sin(u * 3); }
  else if (t < S(3)) { const u = ease((t - S(2)) / SC[2].d); pos[2] = 1.0; fov = lerp(62, 40, u); pitch = .01; }      // slow zoom to far end
  else if (t < S(4)) { const u = (t - S(3)) / SC[3].d; pos[2] = lerp(1.0, 1.6, u); fov = lerp(40, 55, easeOut(u)); roll = .04 * Math.sin(u * 2); shake = 1 + u * 1.5; }
  else if (t < S(5)) {
    const u = t - S(4);                                     // whip to the door, struggle, then look back
    const turn = u < .4 ? ease(u / .4) : u < 5.6 ? 1 : 1 - ease((u - 5.6) / .45);
    const walk = ease(clamp(u / .9)); yaw = -.68 * turn; pos = [lerp(0, .25, turn), 1.58, lerp(1.6, -1.0, walk)]; pitch = lerp(0, -.22, turn); fov = 60;
    shake = turn > .5 && u < 5.6 ? 4 : 2;
  }
  else if (t < S(6)) { const u = t - S(5); pos = [.2, 1.6, -1.0]; fov = 55; shake = .6; if (u > 7.6 && u < 8.2) shake = 3; }
  else { pos = [0, 1.6, 2.2]; fov = 60; shake = .4; }
  const h = handheld(t, shake);
  cam.position.set(pos[0] + h[0], pos[1] + h[1], pos[2]);
  cam.fov = fov; cam.updateProjectionMatrix();
  cam.rotation.set(pitch + h[1] * .6, yaw + h[0] * .8, roll + h[2], 'YXZ');
}

/* ---------- 2D overlay ---------- */
function txt(s, x, y, size, alpha, weight = 400, color = '230,232,236', spacing = 0) {
  if (alpha <= 0) return; ctx.save(); ctx.globalAlpha = clamp(alpha); ctx.fillStyle = `rgb(${color})`;
  ctx.font = `${weight} ${size * K}px Baloo`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  if (spacing) ctx.letterSpacing = spacing + 'px'; ctx.shadowColor = 'rgba(0,0,0,.8)'; ctx.shadowBlur = 12 * K;
  ctx.fillText(s, x * K, y * K); ctx.restore();
}
function overlay(t) {
  const H0 = H / K;
  // camcorder-like clock, top: the time ticks past 2:30
  if (t > 1.2 && t < S(5)) {
    const mins = 30 + Math.floor((t - 1.2) / 9); const sec = Math.floor(((t - 1.2) * 1.0) % 60);
    const a = clamp((t - 1.2) / .8) * (t > S(5) - .5 ? clamp((S(5) - t) / .5) : 1);
    txt(`02:${String(mins).padStart(2, '0')}:${String(sec).padStart(2, '0')} AM`, 360, 92, 30, a * .85, 600, '235,235,235', 3);
    if (Math.floor(t * 1.2) % 2 === 0) { ctx.save(); ctx.globalAlpha = a * .9; ctx.fillStyle = '#d61f1f'; ctx.beginPath(); ctx.arc(205 * K, 92 * K, 8 * K, 0, 7); ctx.fill(); ctx.restore(); }
  }
  // the rule card, scene 1
  if (win(t, S(1) + 4.6, S(2))) { const u = t - S(1) - 4.6; const a = clamp(u / .6) * clamp((S(2) - t) / .5);
    txt('RULE #1', 360, 300, 26, a * .7, 600, '200,40,40', 8); txt('ढाई बजे के बाद', 360, 350, 46, a, 600); txt('light मत देखना', 360, 405, 46, a, 600); }
  // end card
  if (t >= S(6)) { const u = t - S(6);
    txt('ढाई बजे', 360, 520, 118, clamp((u - 6.6) / .9) * .95, 800, '236,232,226', 6);
    txt('2:30 AM', 360, 610, 30, clamp((u - 7.2) / .8) * .6, 600, '200,40,40', 14);
    txt(P.credit, 360, 1050, 24, clamp((u - 7.8) / .8) * .55, 400);
    txt('Part 2 chahiye? Follow karo.', 360, 1100, 26, clamp((u - 8.3) / .8) * .7, 600);
  }
}

/* ---------- render ---------- */
window.renderAt = (t) => {
  bulbs.forEach((b, i) => { const l = bulbLevel(i, t); b.L.intensity = 5 * l; b.glass.emissiveIntensity = 2.2 * l; b.glass.color.setScalar(l > .05 ? 1 : .15);
    b.g.rotation.z = Math.sin(t * .8 + i) * (i === 0 && t > S(4) ? .06 : .015); });
  // figure
  const n = nEvents(t); let fz = FZ[n]; let visible = t >= EV[0] + EVLEN * .5 && t < scareT - .02;
  if (t >= S(4)) { const u = t - S(4); fz = u > 5.0 ? -3.4 : FZ[6]; }                       // closer when you look back
  if (t >= S(5)) fz = lerp(-3.4, -2.3, clamp((t - S(5)) / 6));
  fig.position.set(.15, 0, fz); fig.visible = visible || win(t, 1.45, 1.53);                // 2-frame subliminal flash in the opening sputter
  if (win(t, 1.45, 1.53)) fig.position.set(.1, 0, -6.4);
  fig.rotation.y = -.05; fig.userData.head.rotation.z = .35 + Math.sin(t * .7) * .03; fig.userData.hair.rotation.z = -.3 + Math.sin(t * .7) * .03;    // head tilted, wrong angle
  fig.rotation.z = n >= 5 ? .02 : 0;
  // eyes only glint in the dark when it is near
  eyeM.opacity = t > S(5) + 1.5 && t < scareT ? clamp((t - S(5) - 1.5) / 3) * .95 : (t >= S(3) + 9 && t < S(5) ? .25 : 0);
  // the door struggle
