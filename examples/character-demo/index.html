<!doctype html><html><head><meta charset="utf-8"><title>character3d demo</title>
<style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head><body>
<!-- Deterministic: window.renderAt(t) is a pure function of t. Two 3D characters, no SVG, no sprites. -->
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import { makeCharacter, animate, direct, speechFrom } from './character3d.js';
const W = innerWidth, H = innerHeight;
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setSize(W, H); renderer.setPixelRatio(1); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color('#f6e7d4'); scene.fog = new THREE.Fog('#f6e7d4', 6, 14);
const cam = new THREE.PerspectiveCamera(32, W / H, .1, 50);
scene.add(new THREE.HemisphereLight('#fff6ea', '#c9a98a', 1.4));
const sun = new THREE.DirectionalLight('#fff1dc', 2.2); sun.position.set(2.5, 5, 3.5); sun.castShadow = true; sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -3, right: 3, top: 3, bottom: -3 }); scene.add(sun);
const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 64), new THREE.MeshStandardMaterial({ color: '#e9cfb0', roughness: .9 })); floor.rotation.x = -Math.PI / 2; floor.receiveShadow = true; scene.add(floor);
// two characters, all primitives
const A = makeCharacter({ shirt: '#e2475b', hairStyle: 'ponytail', hair: '#1c120c', toon: false });
const B = makeCharacter({ shirt: '#3b7dd8', pants: '#3a3a44', hair: '#3a2416', skin: '#d9a37e', height: 1.05 });
scene.add(A.root, B.root);
// fake VO word timings (in a real project these come from words.json)
const words = [['namaste', .9, 1.4], ['dekho', 3.2, 3.6], ['yeh', 3.6, 3.9], ['naya', 3.9, 4.3], ['rig', 4.3, 4.8], ['kya', 6.4, 6.8], ['scene', 6.8, 7.3], ['haha', 9.0, 9.6], ['badhiya', 10.6, 11.2]].map(([word, start, end]) => ({ word, start, end }));
const marks = { left: [-.5, 0], right: [.5, 0], offL: [-2.6, .4], offR: [2.6, .4] };
const dA = direct({ id: 'swapnil', marks, start: 'offL', speaks: [[.8, 5], [8.9, 9.7]], acts: [
  { t: 0, do: 'walk', to: 'left', d: 1.4, face: .5 }, { t: 5, do: 'think' }, { t: 7.6, do: 'jump' }, { t: 9.0, do: 'laugh' }, { t: 0, expr: 'happy' }, { t: 6.3, expr: 'thinking' }, { t: 8.5, expr: 'excited' } ] }, words);
const dB = direct({ id: 'aarav', marks, start: 'offR', speaks: [[6.3, 7.5], [10.5, 11.4]], acts: [
  { t: .6, do: 'sneak', to: 'right', d: 2.2, face: -.5 }, { t: 4.3, do: 'shock' }, { t: 7.8, do: 'shrug' }, { t: 0, expr: 'sneaky' }, { t: 4.2, expr: 'shock' }, { t: 9.5, expr: 'happy' } ] }, words);
dA.speech = speechFrom(null, 30, [[.8, 5], [8.9, 9.7]], words); dB.speech = speechFrom(null, 30, [[6.3, 7.5], [10.5, 11.4]], words);
window.DURATION = 12;
window.renderAt = (t) => {
  dA.look = t > 2 ? { x: .5, y: 1.55, z: 0 } : null;   // fixed points at the other mark: safe for chunked renders
  dB.look = t > 3 ? { x: -.5, y: 1.5, z: 0 } : null;
  animate(A, t, dA); animate(B, t, dB);
  const push = Math.min(1, t / 12);
  cam.position.set(Math.sin(t * .15) * .4, 1.25, 7.4 - push * 1.4); cam.lookAt(0, .92, 0);
  renderer.render(scene, cam);
};
window.grab = (t, q = .92) => { window.renderAt(t); return renderer.domElement.toDataURL('image/jpeg', q); };
window.renderAt(0); window.READY = true;
</script></body></html>
